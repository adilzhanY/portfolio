<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The editor page. It is public, and that is fine: it can do nothing until
      it holds a GitHub token with push access to this repository. Anyone else
      who signs in gets a token for their own account and is refused by GitHub.
      Kept out of search results all the same.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Blog editor</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <!--
      Sveltia CMS, pinned to an exact version with its hash. This page holds a
      token that can push to main, so a new release must never run here by
      itself. To upgrade, change the version and recompute the hash:
      curl -s <url> | openssl dgst -sha384 -binary | base64
      Reads ./config.yml beside it.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.209.2/dist/sveltia-cms.js"
      integrity="sha384-VIyPnckA2e8p2GtAhzan+3HaOpxvMP+s/8IhhlLLBMrmALvoDSAKe446Rky3CZ2H"
      crossorigin="anonymous"
      type="module"
    ></script>
  </body>
</html>
