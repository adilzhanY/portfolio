<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The editor page. It is public, and that is fine: it can do nothing until
      it holds a GitHub token with push access to this repository. Anyone else
      who signs in gets a token for their own account and is refused by GitHub.
      Kept out of search results all the same.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Blog editor</title>
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <!--
      Sveltia CMS, pinned to a minor version so a release cannot break the
      editor without a deliberate bump here. Reads ./config.yml beside it.
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.209/dist/sveltia-cms.js"
      type="module"
    ></script>
  </body>
</html>
